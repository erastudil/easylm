name: Bug
description: Something in the running app is wrong
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you did, and what the tab did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 131 on Windows 11
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://easylm.vercel.app
