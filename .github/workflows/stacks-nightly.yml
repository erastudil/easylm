name: stacks-nightly

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: stacks audit
        run: node scripts/nightly_stacks.mjs -v
      - name: compile + test
        run: |
          node scripts/compile_stacks.mjs
          npm ci || npm install
          npm test
      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-report
          path: stacks/NIGHTLY_REPORT.md
      - name: open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const body = [
              'FROM: stacks-nightly',
              'TASK: daily stacks audit failed',
              `CTX: stacks/NIGHTLY_REPORT.md (artifact on run ${context.runId})`,
              'DID: audit ran; exit nonzero — see log and artifact',
              'NEXT: fix listed FAIL rows or accept them as warns with a LAW.md note',
              'OPEN: none'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `stacks audit fail ${date}`,
              labels: ['stacks-kaizen'],
              body
            });